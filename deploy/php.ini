; Recommended PHP settings for Kolam. Copy to /etc/php/8.3/fpm/conf.d/90-kolam.ini and restart php-fpm.
upload_max_filesize = 55M
post_max_size = 60M
memory_limit = 256M
max_execution_time = 120
expose_php = Off
session.use_strict_mode = 1
opcache.enable = 1
opcache.validate_timestamps = 0   ; set to 1 if you edit PHP files in place on the server
