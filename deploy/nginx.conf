# Example Nginx site for Kolam (Ubuntu + php-fpm). Save as /etc/nginx/sites-available/kolam
# then: ln -s ../sites-available/kolam /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Get HTTPS with:  certbot --nginx -d notes.example.com

server {
    listen 80;
    server_name notes.example.com;

    # the project folder itself; server/, storage/, data/ and dotfiles are blocked below
    root /var/www/kolam;
    index index.html;

    client_max_body_size 60m;          # keep >= MAX_UPLOAD_MB

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # OAuth discovery for MCP clients (Claude Code, Codex) lives under /api/.well-known/; let it past the dotfile rule
    location ^~ /api/.well-known/ { rewrite ^ /api/index.php last; }
    # never serve dotfiles (.env), server code, stored data, deploy files or the marketing site and its source (its own domain)
    location ~ /\. { deny all; }
    location ~ ^/(server|storage|data|deploy|site|site-src)(/|$) { return 404; }
    location = /README.md { return 404; }

    # API: everything under /api/ goes to the PHP front controller
    location /api/ {
        try_files $uri /api/index.php$is_args$args;
    }
    location = /api/index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # adjust to your PHP version
        fastcgi_read_timeout 120s;
    }
    location ~ \.php$ { return 404; }               # no other PHP is reachable

    # live updates: server/bin/realtime (bash server/bin/install-realtime.sh), with REALTIME_URL=wss://notes.example.com/ws
    location = /ws {
        proxy_pass http://127.0.0.1:8090;           # REALTIME_LISTEN
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # source files are served unbundled under fixed names: let browsers revalidate so updates show up
    location ^~ /src/ {
        add_header Cache-Control "no-cache";
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    # the website's "Start free" and "Sign in" buttons: /signup and /login are the app itself
    location ~ ^/(signup|login)$ { add_header Cache-Control "no-cache"; try_files /index.html =404; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
