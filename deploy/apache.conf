# Example Apache virtual host for Kolam (needs mod_rewrite, mod_headers and PHP).
<VirtualHost *:80>
    ServerName notes.example.com
    DocumentRoot /var/www/kolam

    <Directory /var/www/kolam>
        AllowOverride All          # .htaccess blocks server/, storage/, data/, dotfiles; api/.htaccess routes /api/*
        Require all granted
        Options -Indexes
    </Directory>

    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy same-origin
    Header always set X-Frame-Options SAMEORIGIN

    # source files are served unbundled under fixed names: let browsers revalidate so updates show up
    <LocationMatch "^/(src/|index\.html$)">
        Header set Cache-Control "no-cache"
    </LocationMatch>

    # live updates: server/bin/realtime (bash server/bin/install-realtime.sh), with REALTIME_URL=wss://notes.example.com/ws
    # needs mod_proxy and mod_proxy_wstunnel (a2enmod proxy proxy_wstunnel)
    ProxyPass /ws ws://127.0.0.1:8090/
    ProxyTimeout 3600

    LimitRequestBody 62914560
</VirtualHost>
