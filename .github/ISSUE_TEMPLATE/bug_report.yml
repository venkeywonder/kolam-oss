name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a board
        2. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 131 on macOS 15
  - type: input
    id: server
    attributes:
      label: Server
      description: PHP version, database (SQLite / MySQL / PostgreSQL), web server, realtime server on or off
      placeholder: PHP 8.3, SQLite, nginx, realtime on
  - type: textarea
    id: logs
    attributes:
      label: Errors
      description: Anything from the browser console or the PHP error log (set APP_ENV=development for details).
      render: text
